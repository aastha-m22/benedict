[project]
name = "slack-repo-agent"
version = "0.1.0"
description = "A Slack bot that links channels to repositories and provides intelligent, repo-scoped AI agent conversations"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "slack-bolt>=1.18.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.18.0",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pylint",
    "flake8",
    "black",
    "pytest",
]

[project.scripts]
benedict = "benedict.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benedict"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.pylint]
max-line-length = 100
